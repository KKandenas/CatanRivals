name: catan_rivals
description: >
  Digital 2D-implementation av Catan Duellen (Rivals for Catan) byggd med
  Flutter Web, optimerad för iPad i Safari.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management: separerar spelregler/board-state från UI-widgets.
  flutter_riverpod: ^2.5.1

  # Multiplayer-synk mellan de två iPads via Firebase Realtime Database.
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4

  # Anonym autentisering (se firebase_bootstrap.dart) – inget
  # inloggnings-UI, bara ett tyst signInAnonymously() vid start så att
  # Realtime Database-reglerna kan kräva "auth != null" och därmed
  # stänga av rå åtkomst utifrån (t.ex. curl/Postman mot den publika
  # databas-URL:en) utan att det märks av spelaren.
  firebase_auth: ^5.7.0

  cupertino_icons: ^1.0.8

  # localStorage-åtkomst för SessionStorage (återuppta ett spel efter en
  # sidladdning) – redan en transitiv Firebase-beroende, men listad
  # explicit här eftersom vi använder den direkt (session_storage_web.dart).
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cards/
    - assets/images/cards/resources/
    - assets/images/cards/backs/
    - assets/images/cards/locations/
    - assets/images/cards/buildings/
    - assets/images/cards/heroes/
    - assets/images/cards/actions/
    - assets/images/cards/dioramas/
    - assets/images/cards/icons/
    - assets/images/cards/events/
    - assets/images/ui/
    - assets/images/dice/
